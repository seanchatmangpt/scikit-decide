name: ⚡ Pull request CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-serial-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  qualification:
    name: Exact-head qualification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Assert exact subject identity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error title=REFUSED:EXACT_HEAD_MISMATCH::actual=${actual} expected=${expected}"
            exit 2
          fi
          printf 'exact_head=%s\n' "${actual}"

      - id: routes
        name: Classify change
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            printf 'cache=true\npython=true\npackage=true\nfortune5=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" > changed-files.txt
          cat changed-files.txt
          route() {
            local name="$1"
            local pattern="$2"
            if grep -Eq "$pattern" changed-files.txt; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            else
              echo "$name=false" >> "$GITHUB_OUTPUT"
            fi
          }
          route cache \
            '^(src/autofde_lab/(caching\.py|_cache/)|tests/test_(caching|enterprise_cache)\.py|\.github/workflows/)'
          route python '^(src/|tests/|examples/|pyproject\.toml|uv\.lock|\.github/workflows/)'
          route package '^(src/|cpp/|scripts/|pyproject\.toml|uv\.lock|CMakeLists\.txt|\.github/workflows/)'
          route fortune5 \
            '^(ggen/fortune5/|src/autofde_lab/fortune5/|tests/fortune5/|scripts/verify-fortune5-ggen\.sh|\.github/workflows/(fortune5-ggen|pr-ci)\.yml)'

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install Python 3.12 qualification dependencies
        run: |
          python -m pip install \
            "pre-commit==4.6.1" \
            "build==1.2.2" \
            "numpy==2.2.6" \
            "pytest==8.3.5" \
            "wrapt>=2.2.1,<3" \
            "pynng>=0.6.2" \
            "pathos>=0.2.7" \
            "discrete-optimization>=0.9.0"

      - name: Deterministic quality
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            pre-commit run --show-diff-on-failure --color=always --all-files
            exit 0
          fi
          mapfile -d '' files < <(
            git diff --name-only -z --diff-filter=ACMR \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}"
          )
          if (( ${#files[@]} == 0 )); then
            echo "No checkable files changed."
            exit 0
          fi
          pre-commit run \
            --show-diff-on-failure \
            --color=always \
            --files "${files[@]}"

      - name: Python source smoke
        if: steps.routes.outputs.python == 'true'
        shell: python
        run: |
          from pathlib import Path
          roots = (Path("src"), Path("tests"), Path("examples"))
          for root in roots:
              for path in root.rglob("*.py"):
                  compile(path.read_bytes(), str(path), "exec")

      - name: Reject conflict markers
        if: steps.routes.outputs.python == 'true'
        shell: bash
        run: "! git grep -nE '^(<<<<<<<($| )|=======$|>>>>>>>($| ))' -- ':!uv.lock'"

      - name: Execute Crown kernel / Python 3.12
        if: steps.routes.outputs.python == 'true'
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q \
            tests/autofde/test_authority.py \
            tests/autofde/test_bootstrap.py \
            tests/autofde/test_ercc_control_plane.py \
            tests/autofde/test_default_head_composition_court.py \
            tests/planning/test_fond_policy.py \
            tests/fabric/test_brce.py \
            tests/fabric/test_brce_identity.py \
            tests/fabric/test_public_ontology.py \
            tests/fabric/test_world_model.py \
            tests/fabric/test_guardrails.py \
            tests/fabric/test_self_play.py \
            tests/fabric/test_query_plane.py \
            tests/fabric/test_selection.py \
            tests/fabric/test_selection_store.py \
            tests/fabric/test_metrics.py \
            tests/fabric/test_cognition_debt.py \
            tests/fabric/test_causal_placement.py \
            tests/fabric/test_handoff.py \
            tests/fabric/test_differential_verification.py \
            tests/fabric/test_competitive_benchmark.py \
            tests/fabric/test_coverage_bridge.py \
            tests/fabric/test_hot_path.py \
            tests/fabric/test_crown.py \
            tests/fabric/test_crown_evidence.py \
            tests/fabric/test_crown_errc.py

      - name: Fortune-5 runtime court / Python 3.12
        if: steps.routes.outputs.fortune5 == 'true'
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/fortune5/test_space.py

      - name: Cache qualification / Python 3.12
        if: steps.routes.outputs.cache == 'true'
        env:
          PYTHONPATH: src
        run: |
          python -m compileall -q src/autofde_lab/_cache src/autofde_lab/caching.py
          python -m pytest -q \
            tests/test_caching.py \
            tests/test_enterprise_cache.py

      - name: Source package smoke
        if: steps.routes.outputs.package == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m build --sdist
          archive=$(printf '%s\n' dist/*.tar.gz)
          tar -tzf "$archive" > sdist-files.txt
          grep -Eq '/pyproject\.toml$' sdist-files.txt
          grep -Eq '/src/autofde_lab/__init__\.py$' sdist-files.txt
          grep -Eq '/src/autofde_lab/_cache/' sdist-files.txt
          if [[ "${{ steps.routes.outputs.fortune5 }}" == "true" ]]; then
            grep -Eq '/src/autofde_lab/fortune5/space\.py$' sdist-files.txt
            grep -Eq '/src/autofde_lab/fortune5/catalog\.py$' sdist-files.txt
            grep -Eq '/src/autofde_lab/fortune5/readiness\.py$' sdist-files.txt
            grep -Eq '/src/autofde_lab/fortune5/f5bench\.py$' sdist-files.txt
            grep -Eq '/src/autofde_lab/fortune5/f5verify\.py$' sdist-files.txt
            grep -Eq '/src/autofde_lab/fortune5/enterprise_architecture\.py$' sdist-files.txt
          fi
          test "$(wc -c < "$archive")" -gt 10000

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: steps.routes.outputs.cache == 'true'
        with:
          python-version: "3.10"

      - name: Cache qualification / Python 3.10
        if: steps.routes.outputs.cache == 'true'
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            "numpy==2.2.6" \
            "pytest==8.3.5" \
            "wrapt>=2.2.1,<3" \
            "pynng>=0.6.2" \
            "pathos>=0.2.7" \
            "discrete-optimization>=0.9.0"
          python -m compileall -q src/autofde_lab/_cache src/autofde_lab/caching.py
          python -m pytest -q \
            tests/test_caching.py \
            tests/test_enterprise_cache.py

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: steps.routes.outputs.cache == 'true'
        with:
          python-version: "3.13"

      - name: Cache qualification / Python 3.13
        if: steps.routes.outputs.cache == 'true'
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            "numpy==2.2.6" \
            "pytest==8.3.5" \
            "wrapt>=2.2.1,<3" \
            "pynng>=0.6.2" \
            "pathos>=0.2.7" \
            "discrete-optimization>=0.9.0"
          python -m compileall -q src/autofde_lab/_cache src/autofde_lab/caching.py
          python -m pytest -q \
            tests/test_caching.py \
            tests/test_enterprise_cache.py

  challenger:
    name: Challenger 8x8 value proof
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Assert exact Challenger subject identity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error title=REFUSED:EXACT_CHALLENGER_HEAD_MISMATCH::actual=${actual} expected=${expected}"
            exit 2
          fi
          printf 'challenger_exact_head=%s\n' "${actual}"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install benchmark dependencies
        run: |
          python -m pip install \
            "numpy==2.2.6" \
            "pytest==8.3.5" \
            "wrapt>=2.2.1,<3" \
            "pynng>=0.6.2" \
            "pathos>=0.2.7" \
            "discrete-optimization>=0.9.0"
      - name: Execute compiled issue reasoning tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/fabric/test_issue_reasoning.py
      - name: Execute 8x8 Challenger value benchmark
        env:
          PYTHONPATH: src
        run: |
          python benchmarks/challenger_issue_reasoning.py --repeats 100000 --output challenger-issue-reasoning.csv | tee challenger-summary.json
          python - <<'PY'
          import csv
          rows=list(csv.DictReader(open('challenger-issue-reasoning.csv', encoding='utf-8')))
          assert len(rows)==8
          assert sum(int(r['calls']) for r in rows)==6_400_000
          assert all(int(r['tool_uses_per_portfolio'])==8 for r in rows)
          assert all(r['actuation']=='REFUSED' for r in rows)
          assert all(float(r['calls_per_second'])>0 for r in rows)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: challenger-issue-reasoning-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            challenger-issue-reasoning.csv
            challenger-summary.json
          if-no-files-found: error
