name: Deploy doc

on:
  workflow_call:
    inputs:
      doc-version:
        description: "Version of the library for which documentation is deployed"
        required: false
        default: ""
        type: string
      doc-clean:
        description: "Whether to clean prior documentation outside version folders"
        required: false
        default: "true"
        type: string
      doc-artifact-name:
        description: "Name of the built documentation artifact"
        required: false
        default: "doc"
        type: string
      doc-path:
        description: "Path where the documentation artifact is extracted"
        required: false
        default: "docs/.vuepress/dist"
        type: string
      binder-env-fullref:
        description: "Binder environment ref to build; current ref when empty"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  trigger-binder-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Trigger Binder federation builds
        continue-on-error: true
        env:
          BINDER_ENV_FULLREF: ${{ inputs.binder-env-fullref }}
        shell: bash
        run: |
          set -euo pipefail
          binder_env_full_ref="$BINDER_ENV_FULLREF"
          binder_env_full_ref=${binder_env_full_ref:-"$GITHUB_REPOSITORY/$GITHUB_REF_NAME"}
          echo "Triggering Binder environment build for $binder_env_full_ref"
          bash scripts/trigger_binder.sh "https://ovh.mybinder.org/build/gh/$binder_env_full_ref"
          bash scripts/trigger_binder.sh "https://ovh2.mybinder.org/build/gh/$binder_env_full_ref"
          bash scripts/trigger_binder.sh "https://notebooks.gesis.org/binder/build/gh/$binder_env_full_ref"

  deploy-doc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download documentation artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.doc-artifact-name }}
          path: ${{ inputs.doc-path }}
      - name: Set documentation target path
        id: target
        env:
          DOC_VERSION: ${{ inputs.doc-version }}
        shell: bash
        run: |
          set -euo pipefail
          doc_version="$DOC_VERSION"
          if [[ -z "$doc_version" ]]; then
            doc_version_path="/"
          else
            doc_version_path="/version/$doc_version/"
          fi
          echo "path=$doc_version_path" >> "$GITHUB_OUTPUT"
      - name: Deploy documentation to GitHub Pages branch
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4
        with:
          branch: gh-pages
          folder: ${{ inputs.doc-path }}
          target-folder: ${{ steps.target.outputs.path }}
          commit-message: publish documentation
          single-commit: true
          clean: ${{ inputs.doc-clean }}
          clean-exclude: |
            version/*
