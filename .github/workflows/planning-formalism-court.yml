name: 🧭 Canonical FOND + HDDL court

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: planning-formalism-court-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  planning-court:
    name: Exact-head FOND + HDDL semantics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Assert exact subject identity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error title=REFUSED:EXACT_HEAD_MISMATCH::actual=${actual} expected=${expected}"
            exit 2
          fi
          printf 'planning_exact_head=%s\n' "${actual}"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install canonical planning dependencies
        run: |
          python -m pip install \
            "pytest==8.3.5" \
            "numpy==2.2.6" \
            "gymnasium>=0.29.1,<2" \
            "wrapt>=2.2.1,<3" \
            "pynng>=0.6.2" \
            "pathos>=0.2.7" \
            "discrete-optimization>=0.9.0" \
            "unified-planning[aries]==1.3.0" \
            "up-aries==0.5.0"

      - name: Receipt planning engine identity
        shell: python
        run: |
          from importlib.metadata import version
          import importlib.util

          assert importlib.util.find_spec("unified_planning") is not None
          assert importlib.util.find_spec("up_aries") is not None
          print(f"unified-planning={version('unified-planning')}")
          print(f"up-aries={version('up-aries')}")

      - name: Execute canonical FOND + HDDL court
        env:
          PYTHONPATH: src
        run: |
          # Runtime entry-point discovery is packaging evidence and remains in the
          # installed-wheel/full-integration rail. This court is formalism semantics.
          python -m pytest -q \
            tests/planning/test_fond_policy.py \
            tests/planning/test_fond_hddl_frontier.py \
            tests/domains/python/test_hddl_bridge_domain.py::test_hddl_parse_solve_decompose_and_execute_real_plan \
            tests/domains/python/test_hddl_bridge_domain.py::test_hddl_domain_refuses_flat_problem
