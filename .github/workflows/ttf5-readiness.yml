name: TTF5-AR readiness court

on:
  pull_request:
    branches: [master]
    paths:
      - "src/autofde_lab/fortune5/**"
      - "tests/fortune5/**"
      - "docs/TTF5_AR.md"
      - "docs/ENTERPRISE_ARCHITECTURE_CONTROL_PLANE.md"
      - ".github/workflows/ttf5-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ttf5-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    name: Exact-head TTF5-AR verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Assert exact subject identity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error title=REFUSED:EXACT_HEAD_MISMATCH::actual=${actual} expected=${expected}"
            exit 2
          fi
          printf 'exact_head=%s\n' "${actual}"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install proven Fortune-5 verifier capsule
        run: |
          python -m pip install \
            "numpy==2.2.6" \
            "pytest==8.3.5" \
            "rdflib==7.5.0" \
            "wrapt>=2.2.1,<3" \
            "pynng>=0.6.2" \
            "pathos>=0.2.7" \
            "discrete-optimization>=0.9.0"

      - name: Refuse mockist Fortune-5 proof
        shell: bash
        run: |
          set -euo pipefail
          if grep -nE 'unittest\.mock|Mock\(|MagicMock|patch\(|monkeypatch' \
            tests/fortune5/test_readiness.py \
            tests/fortune5/test_enterprise_architecture.py; then
            echo "::error title=REFUSED:MOCKIST_FORTUNE5_COURT::Chicago-style execution required"
            exit 3
          fi

      - name: Compile Fortune-5 verifier surface
        run: python -m compileall -q src/autofde_lab/fortune5

      - name: Execute TTF5-AR, EA, and Fortune-5 state-space courts
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q \
            tests/fortune5/test_enterprise_architecture.py \
            tests/fortune5/test_readiness.py \
            tests/fortune5/test_space.py
