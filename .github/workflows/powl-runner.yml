name: ⚡ POWL V2 concurrent runner

on:
  pull_request:
    branches: [master]
    paths:
      - "src/autofde_lab/powl/**"
      - "tests/powl/**"
      - "benchmarks/powl_runner.py"
      - ".github/workflows/powl-runner.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: powl-v2-runner-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runner-court:
    name: POWL V2 / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install bounded runner court
        run: |
          python -m pip install \
            "pytest==8.3.5" \
            "wrapt>=2.2.1,<3" \
            "pynng>=0.6.2" \
            "pathos>=0.2.7" \
            "discrete-optimization>=0.9.0"

      - name: Reject mockist concurrency proof
        shell: python
        run: |
          import ast
          from pathlib import Path

          banned_names = {"Mock", "MagicMock", "patch", "monkeypatch"}
          violations = []
          for path in sorted(Path("tests/powl").glob("test_runner*.py")):
              tree = ast.parse(path.read_text(), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      for alias in node.names:
                          if alias.name == "unittest.mock":
                              violations.append((path, node.lineno, f"import {alias.name}"))
                  elif isinstance(node, ast.ImportFrom):
                      if node.module == "unittest.mock":
                          violations.append((path, node.lineno, "from unittest.mock import ..."))
                  elif isinstance(node, ast.Name) and node.id in banned_names:
                      violations.append((path, node.lineno, node.id))
                  elif isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      args = (*node.args.posonlyargs, *node.args.args, *node.args.kwonlyargs)
                      for arg in args:
                          if arg.arg == "monkeypatch":
                              violations.append((path, node.lineno, "monkeypatch fixture"))
          if violations:
              for path, line, detail in violations:
                  print(f"{path}:{line}: banned mockist construct: {detail}")
              raise SystemExit(1)

      - name: Execute real concurrent runner court
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q tests/powl/test_runner*.py

      - name: Benchmark full runner
        env:
          PYTHONPATH: src
        run: |
          python benchmarks/powl_runner.py \
            --workers 8 \
            --warmups 2 \
            --repetitions 9 \
            --json "powl-benchmark-${{ matrix.python-version }}.json"
