name: Fortune-5 ggen CMD court

on:
  pull_request:
    branches: [master]
    paths:
      - "ggen/fortune5/**"
      - "src/autofde_lab/fortune5/**"
      - "tests/fortune5/**"
      - "scripts/verify-fortune5-ggen.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fortune5-ggen-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    name: Exact-head Fortune-5 manufacture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Assert exact subject identity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error title=REFUSED:EXACT_HEAD_MISMATCH::actual=${actual} expected=${expected}"
            exit 2
          fi
          printf 'exact_head=%s\n' "${actual}"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install bounded court dependencies
        run: |
          python -m pip install \
            "numpy==2.2.6" \
            "pytest==8.3.5" \
            "rdflib==7.5.0" \
            "wrapt>=2.2.1,<3" \
            "pynng>=0.6.2" \
            "pathos>=0.2.7" \
            "discrete-optimization>=0.9.0"

      - name: Manufacture and execute Fortune-5 law court
        run: bash scripts/verify-fortune5-ggen.sh

      - name: Execute enterprise architecture board court
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/fortune5/test_enterprise_architecture_board.py
