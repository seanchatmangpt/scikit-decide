name: DSPy maximal combinatorial Groq

on:
  push:
    branches: [agent/sregym-signature-sota]
    paths:
      - scripts/dspy_maximal.py
      - tests/test_dspy_maximal_plan.py
      - .github/workflows/dspy-maximal-groq.yml
  workflow_dispatch:
    inputs:
      model:
        description: LiteLLM/DSPy model id
        required: true
        default: groq/openai/gpt-oss-120b
      compile_optimizers:
        description: Execute bounded optimizer compile surfaces
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: dspy-maximal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-topology:
    name: 1040-edge DfCM topology
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: python -m pip install 'pytest>=8,<9'
      - name: Prove complete inventory and pairwise cover
        run: python -m pytest -q tests/test_dspy_maximal_plan.py

  maximal-live:
    name: 29-kind real DSPy 3.1.3 + Groq
    needs: static-topology
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MODEL_ID: ${{ inputs.model || 'groq/openai/gpt-oss-120b' }}
      AUTOFDE_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Bind exact subject and authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$AUTOFDE_HEAD"
          test -n "$GROQ_API_KEY"
          echo "subject=$AUTOFDE_HEAD" >> "$GITHUB_STEP_SUMMARY"
          echo "model=$MODEL_ID" >> "$GITHUB_STEP_SUMMARY"
      - name: Install exact DSPy runtime
        run: |
          python -m pip install 'uv>=0.8,<1'
          uv pip install --system 'dspy==3.1.3' 'optuna>=4,<5'
          python - <<'PY'
          import dspy
          assert dspy.__version__ == '3.1.3', dspy.__version__
          print('DSPY_RUNTIME=ALIVE', dspy.__version__)
          PY
      - name: Execute maximal structure and optimizer surface
        shell: bash
        run: |
          set -o pipefail
          mkdir -p dspy-maximal-evidence
          args=(python scripts/dspy_maximal.py --model "$MODEL_ID" --output dspy-maximal-evidence/receipt.json --strict)
          if [[ "${{ github.event_name != 'workflow_dispatch' || inputs.compile_optimizers }}" == "true" ]]; then
            args+=(--compile-optimizers)
          fi
          "${args[@]}" 2>&1 | tee dspy-maximal-evidence/run.log
      - name: Surface maximal receipt
        if: always()
        shell: bash
        run: |
          cat dspy-maximal-evidence/receipt.json 2>/dev/null || true
          if [[ -f dspy-maximal-evidence/receipt.json ]]; then
            python - <<'PY'
          import json
          r=json.load(open('dspy-maximal-evidence/receipt.json'))
          c=r['coverage']
          print('technicalStanding=',r['technicalStanding'])
          print('cartesian_candidates=',r['combinatorial_space']['cartesian_candidates'])
          print('pairwise_selected=',r['combinatorial_space']['pairwise_selected'])
          print('module_execute_alive=',len(c['module_execute_alive']),c['module_execute_alive'])
          print('optimizer_construct_alive=',len(c['optimizer_construct_alive']),c['optimizer_construct_alive'])
          print('optimizer_compile_alive=',len(c['optimizer_compile_alive']),c['optimizer_compile_alive'])
          PY
          fi
      - name: Preserve maximal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dspy-maximal-${{ github.sha }}
          path: dspy-maximal-evidence/
          if-no-files-found: warn
