name: Planner League PSRO Crown

on:
  push:
    branches:
      - agent/v26.9.1-psro-meta-selection
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: planner-league-psro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  psro:
    name: Exact-head PSRO meta-selection court
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Assert exact subject identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "${GITHUB_SHA}"
          printf 'exact_head=%s\n' "$actual"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install focused verifier
        run: |
          python -m pip install \
            "numpy==2.2.6" \
            "pytest==8.3.5" \
            "wrapt>=2.2.1,<3" \
            "pynng>=0.6.2" \
            "pathos>=0.2.7" \
            "discrete-optimization>=0.9.0"

      - name: Compile Planner League subject
        run: python -m compileall -q src/autofde_lab/planner_league tests/planner_league

      - name: Refuse mockist Planner League courts
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'unittest\.mock|Mock\(|MagicMock|patch\(|monkeypatch' tests/planner_league; then
            echo 'REFUSED:PLANNER_LEAGUE_MOCKIST_COURT'
            exit 2
          fi

      - name: Execute parent Planner League and PSRO behavioral courts
        env:
          PYTHONPATH: src
        run: python -m pytest -v tests/planner_league

      - name: Assert PSRO authority ceiling remains non-actuating
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from autofde_lab.planner_league import (
              LeagueMatch,
              PayoffHypergraph,
              PayoffObservation,
              PolicySpaceResponseOracle,
              PolicySpec,
              PsroState,
          )

          graph = PayoffHypergraph()
          for opponent in ("MCTS", "UCT"):
              match = LeagueMatch(
                  world_id="cyber_incident",
                  left_role_id="blue_defender",
                  left_policy=PolicySpec.for_role("Astar", "blue_defender"),
                  right_role_id="red_disturbance",
                  right_policy=PolicySpec.for_role(opponent, "red_disturbance"),
              )
              graph.add(PayoffObservation(match, 1.0, -1.0, f"receipt-Astar-{opponent}"))

          step = PolicySpaceResponseOracle(
              graph,
              role_id="blue_defender",
              opponent_role_id="red_disturbance",
              world_id="cyber_incident",
          ).step(PsroState.seed(("MCTS", "UCT")), candidates=("Astar",))

          assert step.advanced
          assert step.receipt is not None
          assert step.receipt.claim_ceiling == "EMPIRICAL_META_SELECTION_ONLY"
          assert step.receipt.do_authority is False
          print(step.receipt.identity_sha256)
          PY
