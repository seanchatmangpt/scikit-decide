name: Life autonomic case-study qualification

on:
  pull_request:
    branches: [master]
    paths:
      - "src/autofde_lab/agent/life_autonomic_case_study.py"
      - "tests/agent/test_life_autonomic_case_study.py"
      - "docs/case-studies/life-autonomic-controller.md"
      - ".github/workflows/life-autonomic-case-study.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: life-autonomic-case-study-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Exact-head Chicago case study
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GYMACT_SUBJECT_SHA: 574e57b30294aa5f3a64105c767e262b32363417
      WASM4PM_COMPAT_SHA: 577e2d1d8bdfe27d96f61c63f3ea120994e8bfda
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Admit exact subject
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          printf 'autofde_subject_sha=%s\n' "$actual"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Resolve focused validation capsule
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            "numpy==2.2.6" \
            "pytest==8.4.2" \
            "pytest-asyncio>=1,<2" \
            "wrapt>=2.2.1,<3" \
            "pynng>=0.6.2" \
            "pathos>=0.2.7" \
            "discrete-optimization>=0.9.0" \
            "wasm4pm-compat-pydantic @ git+https://github.com/seanchatmangpt/wasm4pm-compat.git@$WASM4PM_COMPAT_SHA#subdirectory=python" \
            "gymact @ git+https://github.com/seanchatmangpt/gymact.git@$GYMACT_SUBJECT_SHA"

      - name: Refuse mockist seams
        shell: bash
        run: |
          set -euo pipefail
          ! grep -nE 'unittest\.mock|\bMock\(|\bMagicMock\(|\bpatch\(|monkeypatch' \
            tests/agent/test_life_autonomic_case_study.py

      - name: Execute Chicago case-study court
        env:
          PYTHONPATH: src
        run: >-
          python -m pytest -vv
          tests/agent/test_life_autonomic_case_study.py

      - name: Execute case study and validate planning receipt
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/life-autonomic
          python -m autofde_lab.agent.life_autonomic_case_study \
            | tee artifacts/life-autonomic/receipt.json
          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path("artifacts/life-autonomic/receipt.json").read_text())
          assert receipt["exact_reuse_disposition"] == "EXACT_REUSE"
          assert receipt["repair_disposition"] == "REPAIR"
          assert receipt["repair_affected_paths"] == ["1", "3"]
          assert receipt["continue_disposition"] == "CONTINUE"
          assert receipt["fresh_goal_disposition"] == "FRESH_PLAN"
          assert receipt["authority"] == "NONE"
          assert receipt["do_authority"] is False
          assert receipt["evidence_kind"] == "PLANNING_EVIDENCE_ONLY"
          assert len(receipt["frontier_keys"]) == 3
          assert len(set(receipt["frontier_keys"])) == 3
          print("LIFE_AUTONOMIC_CASE_STUDY_ALIVE", receipt["receipt_sha256"])
          PY

      - name: Retain exact-head planning evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: life-autonomic-case-study-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/life-autonomic/
          if-no-files-found: error
          retention-days: 30
