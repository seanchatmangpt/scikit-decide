name: Monte Carlo stability qualification

on:
  pull_request:
    branches: [master]
    paths:
      - "src/autofde_lab/reasoning/montecarlo_stopping.py"
      - "tests/reasoning/test_montecarlo_stopping_chicago.py"
      - ".github/workflows/montecarlo-stability-qualification.yml"

permissions:
  contents: read

jobs:
  stability:
    name: Exact-head Monte Carlo stability court
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Assert exact subject identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Install bounded repository dependency capsule
        run: |
          python -m pip install \
            "numpy==2.2.6" \
            "pytest==8.3.5" \
            "wrapt>=2.2.1,<3" \
            "pynng>=0.6.2" \
            "pathos>=0.2.7" \
            "discrete-optimization>=0.9.0"

      - name: Refuse mockist seams
        shell: bash
        run: |
          ! grep -nE 'unittest\.mock|\bMock\(|\bMagicMock\(|\bpatch\(|monkeypatch' \
            tests/reasoning/test_montecarlo_stopping_chicago.py

      - name: Execute stability and fixed-n correspondence courts
        env:
          PYTHONPATH: src
        run: >-
          python -m pytest -v
          tests/reasoning/test_montecarlo_stopping_chicago.py
          tests/reasoning/test_montecarlo_chicago.py
