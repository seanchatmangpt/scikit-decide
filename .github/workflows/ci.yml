name: 🧪 Full qualification and release

on:
  push:
    branches: [master]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
  schedule:
    - cron: "45 1 * * 3"

permissions:
  contents: read

concurrency:
  group: full-ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  BOOST_DIR: 3rdparty/boost
  BOOST_VERSION: "1.85.0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Deterministic quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: python -m pip install "pre-commit==4.6.1"
      - run: pre-commit run --show-diff-on-failure --color=always --all-files

  cache:
    name: Cache qualification / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install focused verifier dependencies
        run: |
          python -m pip install \
            "numpy==2.2.6" \
            "pytest==8.3.5" \
            "wrapt>=2.2.1,<3" \
            "pynng>=0.6.2" \
            "pathos>=0.2.7" \
            "discrete-optimization>=0.9.0"
      - run: python -m compileall -q src/autofde_lab/_cache src/autofde_lab/caching.py
      - env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_caching.py tests/test_enterprise_cache.py

  wheel:
    name: Wheel / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2
        with:
          cmake-version: "4.0.3"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: boost-cache
        with:
          path: ${{ env.BOOST_DIR }}
          key: boost-${{ env.BOOST_VERSION }}
      - name: Install Boost headers
        if: steps.boost-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$BOOST_DIR"
          curl --fail --silent --show-error --location \
            "https://archives.boost.io/release/$BOOST_VERSION/source/boost_${BOOST_VERSION//./_}.tar.bz2" \
            | tar jxf - -C "$BOOST_DIR" --strip-components=1 \
              "boost_${BOOST_VERSION//./_}/boost"
      - name: Install macOS compiler dependencies
        if: runner.os == 'macOS'
        run: brew install libomp
      - name: Admit MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $vcvarsall = Join-Path $vsPath "VC\Auxiliary\Build\vcvarsall.bat"
          cmd /c "`"$vcvarsall`" amd64 >nul && set" | ForEach-Object {
            if ($_ -match '^(PATH|INCLUDE|LIB|LIBPATH)=(.*)$') {
              "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV
            }
          }
      - name: Build wheel
        env:
          CMAKE_GENERATOR: Ninja
        run: |
          export Boost_ROOT="$GITHUB_WORKSPACE/$BOOST_DIR"
          python -m pip install "build==1.2.2"
          python -m build --wheel
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  source:
    name: Source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: |
          python -m pip install "build==1.2.2"
          python -m build --sdist
          tar -tzf dist/*.tar.gz > sdist-files.txt
          grep -Eq '/src/autofde_lab/_cache/' sdist-files.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: source-distribution
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  integration:
    name: Linux integration authority
    needs: wheel
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wheel-ubuntu-latest-3.12
          path: wheels
      - name: Install system and MiniZinc dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes libeccodes-dev libegl1
          mkdir -p bin
          curl --fail --location --output bin/minizinc.AppImage \
            https://github.com/MiniZinc/MiniZincIDE/releases/download/2.8.5/MiniZincIDE-2.8.5-x86_64.AppImage
          chmod +x bin/minizinc.AppImage
          (cd bin && ./minizinc.AppImage --appimage-extract)
          echo "$GITHUB_WORKSPACE/bin/squashfs-root/usr/bin" >> "$GITHUB_PATH"
          # Do NOT export the AppImage's lib dir as a job-wide LD_LIBRARY_PATH:
          # it shadows the runner's libpcre2 and breaks /usr/bin/git
          # (`symbol lookup error: undefined symbol: pcre2_maketables_free_8`,
          # exit 127) -- confirmed live on run 33942465338 once #110 made the
          # next step clone git-sourced deps, and it even fails checkout's
          # post-job `git version`. Publish the path and scope it to the two
          # steps that actually run minizinc.
          echo "MINIZINC_LIB=$GITHUB_WORKSPACE/bin/squashfs-root/usr/lib" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          version: "0.9.2"
          python-version: "3.12"
          enable-cache: true
      - name: Install wheel and integration dependencies
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(find wheels -maxdepth 1 -name 'autofde_lab*.whl' -print -quit)
          test -n "$wheel"
          # uv honors pyproject.toml's [tool.uv.sources] git redirects
          # (wasm4pm-compat-pydantic, gymact) only when resolving the
          # *project* from its lock -- never when installing a prebuilt
          # wheel path, whose METADATA carries bare names. Confirmed live
          # after PR#108 (run 33939249689): `uv pip install wheel[all]`
          # still fails with `No solution found ... wasm4pm-compat-pydantic
          # was not found in the package registry`. So export the frozen
          # lock's resolved requirement set (git URLs included, markers
          # kept) and install that; then the wheel itself with --no-deps.
          uv export --frozen --format requirements-txt --extra all --group test \
            --no-dev --no-hashes --no-emit-project -o /tmp/autofde-lab-all.txt
          uv pip install --system -r /tmp/autofde-lab-all.txt \
            "ortools!=9.15.6755" "llvmlite>=0.45"
          uv pip install --system --no-deps "$wheel"
          LD_LIBRARY_PATH="$MINIZINC_LIB" minizinc --version
      - name: Run integration partitions
        shell: bash
        env:
          # Scoped here (not job-wide) so the git-backed install step above
          # keeps the runner's own libraries; see the MiniZinc step comment.
          LD_LIBRARY_PATH: ${{ env.MINIZINC_LIB }}
          # Same fix the Justfile already documents and applies locally
          # (see its own PYTHONPATH comment): Ray's spawned worker
          # processes (this partition's tests/solvers/python/test_gnn_ray_rllib.py
          # and the autoregressive sb3 suite) don't inherit pytest's
          # in-process sys.path insertion when unpickling test-defined
          # classes to reimport them by name in a separate process -- they
          # only see the PYTHONPATH env var as set at worker launch.
          # Confirmed live on run 33957629757 (first run in which this job
          # ever got past the wheel-install step, since #110/#113 fixed
          # that): every Ray-worker test failed with
          # `ModuleNotFoundError: No module named 'solvers'`
          # (`ray::GraphRolloutWorker.__init__()` -> RaySystemError). Not a
          # regression from this session's own PRs (none touch tests/solvers
          # or Ray config) -- the install had simply never succeeded far
          # enough for this gap to be observable before.
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          pytest -vv tests/solvers/python \
            --ignore tests/solvers/python/test_optuna_rayrllib.py
          pytest -vv tests/solvers/python/test_optuna_rayrllib.py
          pytest -vv tests/scheduling
          pytest -vv --ignore-glob 'tests/*/cpp' \
            --ignore tests/solvers/python \
            --ignore tests/scheduling
          pytest -vv --timeout=300 tests/*/cpp

  docs:
    name: Documentation qualification
    needs: wheel
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: yarn
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wheel-ubuntu-latest-3.10
          path: wheels
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          enable-cache: true
      - name: Install wheel and build documentation
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(find wheels -maxdepth 1 -name 'autofde_lab*.whl' -print -quit)
          test -n "$wheel"
          # The `receipts` extra's wasm4pm-compat-pydantic (and `gymact`)
          # exist only via [tool.uv.sources] git redirects in pyproject.toml,
          # not on PyPI and not in the wheel's METADATA. uv honors those
          # redirects only when resolving the *project* from its lock --
          # not for a prebuilt wheel path, which is why PR#108's
          # `uv pip install wheel[all]` still failed live (run 33939249689:
          # `No solution found ... wasm4pm-compat-pydantic was not found in
          # the package registry`). Export the frozen lock's resolved set
          # (git URLs included, markers kept) and install that; then the
          # wheel with --no-deps.
          py="$(python -c 'import sys; print(sys.executable)')"
          uv export --frozen --format requirements-txt --extra all \
            --no-dev --no-hashes --no-emit-project -o /tmp/autofde-lab-all.txt
          uv pip install --python "$py" -r /tmp/autofde-lab-all.txt
          uv pip install --python "$py" --no-deps "$wheel"
          yarn install --frozen-lockfile
          yarn docs:build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: documentation
          path: docs/.vuepress/dist
          if-no-files-found: error
          retention-days: 7

  gate:
    name: Full qualification gate
    if: always()
    needs: [quality, cache, wheel, source, integration, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every qualification authority
        env:
          QUALITY: ${{ needs.quality.result }}
          CACHE: ${{ needs.cache.result }}
          WHEEL: ${{ needs.wheel.result }}
          SOURCE: ${{ needs.source.result }}
          INTEGRATION: ${{ needs.integration.result }}
          DOCS: ${{ needs.docs.result }}
        shell: bash
        run: |
          set -euo pipefail
          for result in "$QUALITY" "$CACHE" "$WHEEL" "$SOURCE" "$INTEGRATION" "$DOCS"; do
            [[ "$result" == success ]] || {
              echo "Qualification authority ended with: $result"
              exit 1
            }
          done

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v') && needs.gate.result == 'success'
    needs: [gate, wheel, source]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: source-distribution
          path: dist
      - uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          artifacts: dist/*
          tag: ${{ github.ref_name }}
          generateReleaseNotes: true
      - name: Refuse to publish anything but this fork's own distribution
        # This job is tag-gated (line 286) and this repo has zero tags as of
        # the AutoFDE Lab rename, so it has never fired. Before the rename it
        # could still have attempted to publish a wheel named "scikit-decide"
        # -- Airbus's PyPI package -- from a fork, on any stray v* tag with
        # PYPI_API_TOKEN set. It would have 403'd rather than succeeded,
        # which was luck, not design. This step makes the check structural:
        # every dist artifact's declared name must equal this fork's own.
        run: |
          for f in dist/*; do
            case "$f" in
              *.whl) name=$(unzip -p "$f" '*.dist-info/METADATA' | grep -m1 '^Name: ' | cut -d' ' -f2) ;;
              *.tar.gz) name=$(tar -xzOf "$f" '*/PKG-INFO' | grep -m1 '^Name: ' | cut -d' ' -f2) ;;
              *) continue ;;
            esac
            if [ "$name" != "autofde-lab" ]; then
              echo "REFUSED: $f declares distribution name '$name', expected 'autofde-lab'" >&2
              exit 1
            fi
          done
      - name: Publish to PyPI when configured
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        if: env.PYPI_API_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  deploy-docs:
    name: Deploy qualified documentation
    if: >-
      needs.gate.result == 'success' &&
      (github.event_name == 'push')
    needs: [gate, docs]
    permissions:
      contents: write
    uses: ./.github/workflows/deploy-doc.yml
    with:
      doc-artifact-name: documentation
      doc-clean: ${{ startsWith(github.ref, 'refs/tags/v') && 'false' || 'true' }}
      doc-version: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      binder-env-fullref: ${{ format('{0}/{1}', github.repository, github.ref_name) }}
