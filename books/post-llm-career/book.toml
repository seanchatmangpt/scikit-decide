[book]
title = "The Post-LLM Career"
authors = ["Sean Chatman"]
description = "How to work, get hired, and build leverage when intelligence is abundant"
language = "en"
multilingual = false
src = "src"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
smart-punctuation = true
git-repository-url = "https://github.com/seanchatmangpt/scikit-decide"
edit-url-template = "https://github.com/seanchatmangpt/scikit-decide/edit/master/books/post-llm-career/{path}"

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
