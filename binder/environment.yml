name: nb-autofde-lab-py310
channels:
  - pytorch
  - defaults
dependencies:
  - cartopy>=0.21
  - python=3.10
  - pip
  - pytorch::cpuonly
  - pytorch::pytorch
  - pip:
    - cdsapi
    - cfgrib
    - cartopy
    - matplotlib
    - ipywidgets
    - ipympl
    # Was: scikit-decide[all]==1.0.2 -- a version this fork's git-derived
    # setuptools_scm can never produce, so it resolved against Airbus's
    # published PyPI package instead of this checkout. Install the local
    # checkout explicitly via Binder's build context (the repo root, one
    # level up from binder/) rather than a version pin.
    - -e ..[all]
    - nbgitpuller
    - openap
    - pygeodesy
    - pyvirtualdisplay
    - PyOpenGL-accelerate
    - PyOpenGL
    - xarray
    - gymnasium[classic-control]==0.28.1
    - folium
    - pyRDDLGym-jax[dashboard]
    - git+https://github.com/aiplan4eu/up-autofde_lab.git
    - optuna
    - optuna-dashboard
    - renderlab
    - moviepy==1.0.3
    - opencv-python
