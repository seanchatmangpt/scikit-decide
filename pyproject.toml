    "graph-jsp-env>=1",
    "pytest-cases>=3.8",
    "optuna>=4.5.0",
    "pytest-xdist>=3.8", # -n for parallel test workers; see Justfile's `test` target
]

[tool.uv]
default-groups = "all"

[tool.uv.sources]
wasm4pm-compat-pydantic = { git = "https://github.com/seanchatmangpt/wasm4pm-compat.git", rev = "577e2d1d8bdfe27d96f61c63f3ea120994e8bfda", subdirectory = "python" }
gymact = { git = "https://github.com/seanchatmangpt/gymact.git", rev = "524d0bc8633d8534f500d67f27384ce9368c0863" }

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
# Deliberately NOT --import-mode=importlib here, global -- see
# docs/STATUS.md Pass 6. importlib mode is the correct fix for two real
# collisions (tests/solvers/cpp/test_pomcp.py vs .../python/test_pomcp.py;
# a bare-conftest collision touching tests/solvers/python/{openevolve,
# autoregressive}), but it's measurably slower than the default "prepend"
# mode (~2.2x: just test went from ~4.8s to ~11s when this was global).
# just test's --ignore list already excludes every file involved in either
# collision, so the hot loop never needs it. It's applied per-invocation
# instead, only on test-full's partitions that actually touch those files
# -- see the Justfile.

[build-system]
requires = ["scikit-build-core>=0.11.6,<1"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
logging.level = "INFO"
sdist.exclude = ["cpp/tests/data"]
wheel.packages = ["src/autofde_lab", "src/skdecide"]
wheel.install-dir = "autofde_lab/hub"
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
cmake.source-dir = "cpp"
build-dir = "build/{wheel_tag}"  # speedup rebuilds (https://scikit-build-core.readthedocs.io/en/latest/configuration/index.html#other-options)

[tool.scikit-build.cmake.define]
ONLY_PYTHON = true

[tool.setuptools_scm]
