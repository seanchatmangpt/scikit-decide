[project]
name = "autofde-lab"
description = "AutoFDE Lab: exploration, falsification, and proof environment for persistent, governed AutoFDE capabilities. Forked from scikit-decide."
authors=[
  {name= "Sean Chatman",  email = "sean@chatmangpt.com"},
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["reinforcement learning", "planning", "scheduling"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Development Status :: 4 - Beta",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Programming Language :: C++",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
]
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "pynng>=0.6.2",
    "pathos>=0.2.7",
    "discrete-optimization>=0.9.0",
    "wrapt>=2.2.1",
    # Real dependency on the standalone GymAct package, resolved from an
    # exact GitHub revision in `[tool.uv.sources]`, for
    # `autofde_lab.hub.domain.azuregoat_privesc.gymact_bridge`'s real
    # `EnvironmentProvider`/`Environment` implementation -- not faked.
    # Marker added 2026-08-08: gymact declares requires-python >=3.11,<4.0 while
    # this project declares >=3.10, so uv's 3.10 resolution split was
    # unsatisfiable and `uv run` failed. The marker excludes gymact from that
    # split rather than narrowing this project's own supported range.
    "gymact; python_version >= '3.11'",
]

[project.urls]
documentation = "https://seanchatmangpt.github.io/autofde-lab/"
repository = "https://github.com/seanchatmangpt/autofde-lab"
upstream = "https://github.com/airbus/scikit-decide"

[project.optional-dependencies]
shared = [  # define a common extra to avoid redefining dependencies in both domains and solvers
    "gymnasium>=0.29.1,<2",  # verified real: gymnasium>=1 is required by ray[rllib]>=2.52.1 (real
    # gymnasium.VectorizeMode import at rllib import time) and works with GymDomain (real
    # PPO train+rollout via RayRLlib on gymnasium==1.3.0); <2 matches stable-baselines3's own
    # real declared ceiling (gymnasium<2.0,>=0.29.1). AsLegacyGymV21Env/AsGymnasiumEnv (which
    # wrap pre-gymnasium legacy `gym` environments) require gymnasium<1's now-removed
    # EnvCompatibility/LegacyEnv classes and raise a clear real ImportError if instantiated
    # on gymnasium>=1 -- see autofde_lab/hub/domain/gym/gym.py.
    "numpy>=2.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "numpy >=1.20.1,<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "scipy>=1.9.2",
    # The `<1.3` ceiling this line carried through 2026-09-04 was a real,
    # load-bearing pin, not decoration: UP 1.3.0 changed `UPState.__init__`'s
    # signature (added a required `problems_fluent_set` positional parameter)
    # -- confirmed live, `TypeError: UPState.__init__() missing 1 required
    # positional argument: 'problems_fluent_set'` on every
    # `UPDomain._get_initial_state_()` call under 1.3.0, breaking all 9
    # `tests/domains/python/test_up_bridge_domain.py` cases. Fixed forward,
    # this session, rather than re-freezing the ceiling: all 5 real
    # `UPState(...)` construction sites in `autofde_lab/hub/domain/up/up.py`
    # now pass `self._problem` (a real `FluentsSetMixin`, confirmed via
    # `issubclass(Problem, FluentsSetMixin)`) as `problems_fluent_set`.
    # Re-verified real, this session: 9 passed, 1 pre-existing-unrelated skip
    # (macOS libomp).
    "unified-planning>=1.3",
]
hddl = [
    "autofde-lab[shared]",
    # Latest published Unified Planning + its canonical Aries extra --
    # real HTN/HDDL engine, no version ceiling held back for compatibility.
    "unified-planning[aries]>=1.3",
    # `unified-planning[aries]`'s own only constraint is `up-aries>=0.4.0`.
    # Verified live at latest (`unified-planning==1.3.0`, `up-aries==0.5.0`,
    # both current head as of this pin): real Aries HTN solve, real
    # method-decomposition + primitive-action-projection checks, real
    # primitive-plan replay through the now-1.3-compatible UPDomain
    # transition semantics above, real goal verification -- all passing.
    # (Against the *former* `<1.3` UP ceiling, up-aries 0.5.0's `solver.py`
    # set a `PlanRequest.warm_start_plan` proto field the older UP's bundled
    # proto stub didn't define -- that incompatibility is gone now that both
    # are current: not a versions-of-two-packages problem, a
    # stale-ceiling-on-one-of-them problem.)
    "up-aries>=0.5.0",
]
receipts = [  # autofde_lab.receipts admission/broker layer: typed process-mining
    # observation shapes (Receipt/OcelEvent/Evidence/...), see
    # autofde_lab/receipts/wasm4pm_types.py. Pure pydantic, no native/Rust
    # dependency. The package is `wasm4pm-compat-pydantic` (module
    # `wasm4pm_compat_pydantic`) and is resolved from the `python` subdirectory
    # of an exact wasm4pm-compat GitHub revision below.
    "wasm4pm-compat-pydantic",
]
domains = [
    "autofde-lab[shared]", # self-reference allowed by pip since 21.2 (https://github.com/pypa/pip/issues/11296)
    "matplotlib>=3.3.4",
    "openap>=1.5",
    "pygeodesy>=23.6.12",
    "cartopy>=0.22.0",
    "pygrib>=2.1.6; sys_platform == 'linux'",
    "pygrib>=2.1.6; sys_platform == 'darwin' and platform_machine != 'x86_64'",
    "pygrib==2.1.5; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "setuptools<82.0.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",  # pkg_resources removed from 82.0.0, and needed by pygrib 2.1.5
    "pyRDDLGym>=2.3, !=2.7",  # verified real: pyRDDLGym 2.6 installs and works (RDDLDomain construction + rollout) on Python 3.13; the `!=2.7` exclusion is unrelated to 3.13 (https://github.com/pyrddlgym-project/pyRDDLGym-gurobi/issues/6) and is kept as-is
    "pyRDDLGym-rl>=0.2",  # verified real: autofde_lab.hub.domain.rddl unconditionally imports this (SimplifiedActionRDDLEnv), so it's load-bearing, not optional
    "numpy<2.4",  # pyRDDLGym-rl 0.2 (still the latest release on PyPI, uploaded 2024-11-03) calls np.reshape(newshape=...) in SimplifiedActionRDDLEnv; numpy 2.4.0 removed the `newshape` kwarg (deprecated since 2.1, removed in 2.4 per https://numpy.org/doc/2.4/release/2.4.0-notes.html), breaking it on ALL Python versions including 3.13, not just <3.13 as previously assumed here. The upstream fix (https://github.com/pyrddlgym-project/pyRDDLGym-rl/pull/10, merged 2026-03-02) has not been released to PyPI yet -- see https://github.com/pyrddlgym-project/pyRDDLGym-rl/issues/9. Re-narrow this pin once a fixed release ships.
    "rddlrepository>=2.1",
    "plado>=0.1.3",
    "pytz>=2025.2",
]
solvers = [
    "autofde-lab[shared]", # self-reference allowed by pip since 21.2 (https://github.com/pypa/pip/issues/11296)
    "joblib>=1.0.1",
    "ray[rllib]>=2.52.1",  # verified real: 2.52.1 is the first PyPI release with cp313 wheels
    # (previously pinned <2.38 because ray made rllib's "new API stack" the default from 2.38/2.40
    # onward, which this solver's old-stack-specific code -- RolloutWorker subclassing,
    # local_worker(), Policy-based masking models -- cannot use; the solver now explicitly opts
    # into the old stack via `.api_stack(enable_rl_module_and_learner=False,
    # enable_env_runner_and_connector_v2=False)` when building its own default config, so the
    # upper bound is no longer needed -- real PPO train+rollout verified on ray==2.52.1).
    "stable-baselines3>=2",
    "sb3_contrib>=2.3",
    "up-tamer>=1.1.2; python_version < '3.12' and platform_machine == 'x86_64'",
    "up-fast-downward>=0.4.1",
    "up-enhsp>=0.0.25, <0.0.28",
    "up-pyperplan>=1.1.0",
    "pyRDDLGym-jax>=2.5",  # verified real: pyRDDLGym-jax 3.1 (py3-none-any wheel) installs on Python 3.13 with jax/jaxlib 0.11.0 (both have cp313 wheels); RDDLJaxSolver imports and actually solves CartPole_Continuous_gym via rddlrepository on Python 3.13 (tests/solvers/python/test_pyrddlgym_solvers.py::test_pyrddlgymdomain_jax)
    "jax>=0.4; sys_platform == 'linux' or sys_platform == 'darwin'",
    "jax>=0.4, <0.6; sys_platform == 'win32'",
    "pyRDDLGym-gurobi>=0.2",  # verified real: pyRDDLGym-gurobi 0.2 (py3-none-any wheel) installs on Python 3.13; RDDLGurobiSolver imports and actually solves CartPole_Continuous_gym via rddlrepository on Python 3.13 with the already-pinned pyRDDLGym==2.6 (tests/solvers/python/test_pyrddlgym_solvers.py::test_pyrddlgymdomain_gurobi); not separately verified against a paid Gurobi license (the test's small instance ran without one)
    "torch-geometric>=2.5",
    "torch>=2.3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torch>=2.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch!=2.9.0,!=2.9.1,!=2.10, !=2.11.0, !=2.12.0, !=2.12.1; sys_platform == 'win32'",
    "flax>=0.10.6; (sys_platform == 'linux' or sys_platform == 'win32') and python_version >= '3.12'",
    "openevolve>=0.2.11",
]
pddl = [
    "z3-solver",
]
dspy = [
    "dspy",  # unpinned: DSPyPolicy always targets the most recent dspy release
    "faker",  # anti-memorization name substitution for gepa_train.py's offline trainset
]
ofmf = [
    # OFMF compatibility closure, including OFMFEngine. Nothing in autofde_lab
    # imports or registers OFMFEngine; see src/autofde_lab/ofmf/__init__.py.
    "rdflib",
    "blake3",
    "pyshacl",
    "owlrl",
    "pyDatalog",
    "PyShEx",
    "pyoxigraph",
    "pyld",
    "SpiffWorkflow",
]
mcp = [
    # Pin matches requirements-agentic.txt. fabric/mcp.py::create_server() has
    # always imported fastmcp lazily and converted ImportError to a clear
    # RuntimeError -- but nothing installed it by default, so `serve-mcp`
    # never actually started. This extra closes that gap.
    "fastmcp>=3.4.4,<4",
]
gymact = [
    # GymAct kernel surfaces (src/autofde_lab/gymact/): real FastAPI ASGI app,
    # real httpx in-process client against it, real Typer CLI. rdflib/pyshacl
    # come from the `ofmf` extra and fastmcp from `mcp`.
    # The `gymact` package itself (src/autofde_lab/gymact/kernel.py is a thin
    # wrapper over gymact.runtime.GymAct, not an independent reimplementation)
    # is already a base `[project.dependencies]` entry -- GitHub-sourced via
    # `[tool.uv.sources]` -- so it is not repeated here.
    "fastapi>=0.115",
    "httpx>=0.27",
    "typer>=0.12",
    # kubernetes==30.1.0 and langchain>=0.3.25 pinned/floored to match
    # vendor/gyms/sregym/pyproject.toml exactly. Needed only so
    # tests/sota/test_m1_environment_dependencies.py can import the real,
    # vendored sregym.conductor package (registry introspection only -- no
    # cluster actuation, no LLM call) without ModuleNotFoundError;
    # sregym's own conductor/oracles/diagnosis_oracle.py and
    # conductor/oracles/llm_as_a_judge/judge.py import `kubernetes` and
    # `langchain_core` at module scope regardless of whether a cluster is
    # reachable or a judge call is ever made.
    "kubernetes==30.1.0",
    "langchain>=0.3.25",
]
ocpq = [
    # Native PyO3 bindings (wasm4pm-bindings-py) over wasm4pm's real OCPQ
    # query engine (wasm4pm/src/ocpq_runtime.rs), used by
    # hub/domain/gym_procedure/level4_ocpq.py to query the Level 4 OCEL log.
    # Requires a Rust toolchain to build (maturin backend, PEP 517) --
    # deliberately NOT in `all` for that reason, same policy as other
    # native-toolchain extras in this file. Not yet pinned to a pushed
    # wasm4pm git revision (the crate lives at
    # https://github.com/seanchatmangpt/wasm4pm, subdirectory
    # crates/wasm4pm-bindings-py, but the revision built and verified in
    # this session had uncommitted local changes -- pin this to a real
    # pushed rev, mirroring wasm4pm-compat-pydantic's `[tool.uv.sources]`
    # entry below, once wasm4pm-bindings-py is published from a clean
    # commit); until then, build the wheel locally with
    # `maturin build --release -m wasm4pm/crates/wasm4pm-bindings-py/Cargo.toml`
    # and install it into this project's venv.
    #
    # The bare "wasm4pm" requirement below is commented out, 2026-09-04:
    # confirmed live this session that it is not resolvable AT ALL by `uv
    # lock` -- not just on one platform split, but on every split uv's
    # universal resolver tries (first surfaced as
    # `python_full_version >= '3.14' and platform_machine == 'x86_64' and
    # sys_platform == 'darwin'`, then `python_full_version >= '3.12' and
    # python_full_version < '3.14' and sys_platform == 'win32'` once that one
    # was narrowed away) -- `wasm4pm was not found in the package registry`.
    # Because `uv lock` is a universal resolver, an unresolvable requirement
    # in ANY declared extra blocks `uv lock`/`uv lock --check` project-wide,
    # regardless of whether that extra is requested. Restore this line (with
    # a real `[tool.uv.sources]` git pin, once one is verified) rather than
    # leaving it bare -- a bare PyPI name for a package that isn't published
    # will always reproduce this exact failure.
    # "wasm4pm",
]
all = [
    # self-reference allowed by pip since 21.2 (https://github.com/pypa/pip/issues/11296)
    # "receipts" added back 2026-08-12: `uv sync --extra=all` was silently uninstalling
    # wasm4pm-compat-pydantic (src/autofde_lab/receipts/wasm4pm_types.py,
    # src/autofde_lab/constitution/__init__.py, and
    # hub/domain/gym_procedure/dependency_admission.py all import it) because this list
    # never actually included the "receipts" extra it lives under, despite `all` being
    # documented/assumed to mean "everything".
    "autofde-lab[domains, solvers, pddl, dspy, ofmf, mcp, gymact, receipts, hddl]",
]

