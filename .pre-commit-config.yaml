# To use:
#
#     pre-commit run -a
#
# Or:
#
#     pre-commit install  # (runs every time you commit in git)
#
# To update this file:
#
#     pre-commit autoupdate
#
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.2.0
    hooks:
    -   id: trailing-whitespace
        exclude: "^(examples/discrete_optimization/data/|notebooks/.*\\.sm$|notebooks/data/)"
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
        exclude: |
          (?x)^(
            notebooks/icaps24/images/Quadcopter-JaxAgent_example.gif
            |notebooks/icaps24/images/schedule_animation_example.gif
            |uv.lock
          )$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.14.0
    hooks:
      # Identity-bound validation capsules are evidence, not editing surfaces.
      - id: ruff-check
        name: ruff sort imports
        args: [ --fix, --select=I ]
        exclude: ^\.validation/gymact-(base|head)/
      - id: ruff-check
        name: ruff clean unused imports
        args: [ --fix, --select=F401 ]
        exclude: ^\.validation/gymact-(base|head)/
      # Run the formatter on authored source only.
      - id: ruff-format
        exclude: ^(cpp/|\.validation/gymact-(base|head)/)

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v13.0.0
    hooks:
      - id: clang-format
        args: [-i, -style=file]
        files: ^cpp/src/.*\.[ch]{2}$

  - repo: https://github.com/kynan/nbstripout
    rev: 0.5.0
    hooks:
      - id: nbstripout
        files: ^notebooks/

  - repo: local
    hooks:
      - id: sanitize-uv-lock
        name: Sanitizing uv.lock for public PyPI
        entry: bash -c 'sed -i.bak -e "s|\"https://[^\"]*/simple\"|\"https://pypi.org/simple\"|g" -e "s|\"https://[^\"]*/packages/|\"https://files.pythonhosted.org/packages/|g" uv.lock && rm -f uv.lock.bak && git add uv.lock'
        language: system
        files: ^uv\.lock$
        pass_filenames: false
        stages: [pre-commit]
      - id: verify-sota-combinatorial-ggen
        name: Verify ggen combinatorial-maximalism court
        entry: bash scripts/verify-sota-combinatorial-ggen.sh
        language: system
        files: ^(ggen/sota_factory/|scripts/verify-sota-combinatorial-ggen\.sh|src/autofde_lab/sota_factory/(space|compiler|models)\.py|tests/sota_factory/test_combinatorial_maximalism_unit\.py)$
        pass_filenames: false
        stages: [pre-commit]
